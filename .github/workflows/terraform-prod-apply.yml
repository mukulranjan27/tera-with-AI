
name: Terraform Production Apply

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-prod-apply:
    runs-on: [self-hosted, linux, x64]

    environment:
      name: production

    env:
      TF_ENV: prod
      TFVARS_FILE: envs/prod.tfvars
      BACKEND_CONFIG: backend-prod.hcl

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check tools
        run: |
          terraform version
          aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init -input=false -reconfigure -backend-config="${BACKEND_CONFIG}"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan Production
        run: terraform plan -input=false -var-file="${TFVARS_FILE}" -out=tfplan

      - name: Show Production Plan
        run: terraform show -no-color tfplan

      - name: Terraform Apply Approved Plan
        run: terraform apply -input=false -auto-approve tfplan

